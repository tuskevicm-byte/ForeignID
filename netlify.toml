[build]
  command = "cd apps/frontend && npm install --no-audit --no-fund && npm run build"

[build.environment]
  VITE_API_URL = "/api/v1"
  publish = "apps/frontend/dist"

[[redirects]]
  from = "/api/*"
  to = "https://backend-main-current-production.up.railway.app/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = true
